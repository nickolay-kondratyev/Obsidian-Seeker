name: Release

# Obsidian's installer (and BRAT) install a plugin by pulling the GitHub Release
# whose tag EXACTLY matches manifest.json "version" (no leading "v"), with
# main.js / manifest.json / styles.css attached as individual assets.
#
# Cut a release from this repo with:
#   npm version patch        # bumps manifest + versions.json, commits, tags
#   git push --follow-tags   # pushes the tag -> fires this workflow

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Provenance attestation: id-token mints the OIDC token Sigstore signs the
  # build with; attestations lets the run record it against the repo. Users can
  # then `gh attestation verify main.js --repo nickolay-kondratyev/Obsidian-Seeker`.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - name: Build plugin
        run: |
          npm ci
          npm run build
      # Attest the assets actually built in THIS run, so the provenance binds to
      # the published bytes.
      #
      # Best-effort: provenance is a nice-to-have, so a failure here MUST NOT
      # block the release. Artifact attestation requires the repo to be public
      # (or on a plan that allows it), so on a private repo this step fails —
      # continue-on-error lets the release still publish rather than leaving the
      # tag with no assets at all.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Publish immediately so the assets appear the moment the tag is pushed
          # — Obsidian's installer and BRAT need a published (non-draft) release.
          # Add --draft here if you ever want to review before publishing instead.
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            main.js manifest.json styles.css
